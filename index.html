<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gaming Hub - Pro Carrom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.12/signalr.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f0f13; color: white; text-align: center; padding-top: 10px; }
        .card { background: #1c1c24; padding: 25px; border-radius: 15px; width: 500px; margin: auto; box-shadow: 0 8px 25px rgba(0,255,136,0.1); border: 1px solid #2d2d3a; max-width: 90%; }
        h1 { color: #00ff88; margin-bottom: 5px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; background: #2a2a35; color: white; }
        button { width: 95%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-green { background-color: #00ff88; color: black; }
        .btn-green:hover { background-color: #00cc6a; }
        .hidden { display: none; }
        
        /* प्रोफेशनल लाकडी बोर्ड */
        canvas { 
            background: radial-gradient(#f3d3a3, #d99e5a); 
            border-radius: 15px; 
            border: 25px solid #2a160d; 
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 20px rgba(0,255,136,0.2); 
            cursor: crosshair; 
            margin-top: 15px; 
            touch-action: none; 
            max-width: 100%; 
            height: auto;
        }
    </style>
</head>
<body>

    <h1>🎮 Pro Carrom Engine</h1>

    <div class="card" id="loginBox">
        <h2>Player Login</h2>
        <input type="email" id="emailInput" placeholder="Email (e.g. bhau@gaming.com)">
        <input type="password" id="passwordInput" placeholder="Password (Secret@123)">
        <button class="btn-green" onclick="loginUser()">Enter Arena</button>
    </div>

    <div class="card hidden" id="dashboardBox">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: #00ff88; margin: 0;">Hey, <span id="playerName"></span>! 🏆</h2>
            <div style="background: #2a2a35; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #00ff88;">
                <span id="walletStatus" style="color: white;">₹0.00</span>
            </div>
        </div>
        <p style="color: #ccc; font-size: 14px; margin-top: 5px;">Connection: <span id="connectionStatus" style="color: yellow;">Connecting...</span></p>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <script>
        const API_BASE_URL = "https://live-gaming-backend.onrender.com/api";
        let userEmail = "";
        let lastShooter = ""; 
        let wasMoving = false;
        
        // --- Sound Effects ---
        const hitSound = new Audio('https://actions.google.com/sounds/v1/wood/wood_click.ogg');
        const pocketSound = new Audio('https://actions.google.com/sounds/v1/water/drop_in_water.ogg');

        // --- Auto-Register & Login Logic ---
        async function loginUser() {
            const email = document.getElementById("emailInput").value || userEmail;
            const password = document.getElementById("passwordInput").value || "Secret@123";
            const btn = document.getElementById("loginBox").querySelector("button");

            try {
                btn.innerText = "Connecting to Cloud... ☁️"; 
                let response = await fetch(`${API_BASE_URL}/User/login`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ Email: email, PasswordHash: password })
                });

                if (!response.ok) {
                    await fetch(`${API_BASE_URL}/User/register`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Email: email, PasswordHash: password }) });
                    response = await fetch(`${API_BASE_URL}/User/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Email: email, PasswordHash: password }) });
                }

                if (response.ok) {
                    userEmail = email;
                    document.getElementById("loginBox").classList.add("hidden");
                    document.getElementById("dashboardBox").classList.remove("hidden");
                    document.getElementById("playerName").innerText = email.split('@')[0];
                    let resText = await response.text();
                    document.getElementById("walletStatus").innerText = `₹${resText.split(': ')[1]}`;
                    if(document.getElementById("connectionStatus").innerText !== "Online 🟢") startSignalR();
                } else {
                    alert("Cloud Server is waking up! Please wait 30 seconds and try again. ⏳");
                    btn.innerText = "Enter Arena";
                }
            } catch (error) { 
                alert("Server is sleeping! 😴 Click again in 10 seconds to wake it up."); 
                btn.innerText = "Enter Arena"; 
            }
        }

        // --- SignalR Connection ---
        const connection = new signalR.HubConnectionBuilder().withUrl("https://live-gaming-backend.onrender.com/gamehub").build();
        async function startSignalR() {
            try { 
                await connection.start(); 
                document.getElementById("connectionStatus").innerText = "Online 🟢"; 
                document.getElementById("connectionStatus").style.color = "#00ff88"; 
            } catch (err) {}
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- Game Elements ---
        let isDragging = false, dragStartX = 0, dragStartY = 0, mouseX = 0, mouseY = 0;
        let pockets = [ { x: 22, y: 22, radius: 24 }, { x: 378, y: 22, radius: 24 }, { x: 22, y: 378, radius: 24 }, { x: 378, y: 378, radius: 24 } ];
        let striker = { x: 200, y: 335, radius: 16, mass: 3, vx: 0, vy: 0, color: '#f0f0f0', type: 'striker' };
        
        let coins = [];
        const COIN_RAD = 11;
        const MASS = 1;

        // १९ सोंगट्यांची मांडणी
        function setupBoard() {
            coins = [];
            coins.push({ x: 200, y: 200, radius: COIN_RAD, mass: MASS, vx: 0, vy: 0, color: '#e63946', type: 'queen' });
            for (let i = 0; i < 6; i++) {
                let angle = i * (Math.PI / 3); let dist = COIN_RAD * 2.1;
                coins.push({ x: 200 + Math.cos(angle) * dist, y: 200 + Math.sin(angle) * dist, radius: COIN_RAD, mass: MASS, vx: 0, vy: 0, color: i % 2 === 0 ? '#fdfdfd' : '#2b2b2b', type: i % 2 === 0 ? 'white' : 'black' });
            }
            for (let i = 0; i < 12; i++) {
                let angle = i * (Math.PI / 6); let dist = COIN_RAD * 4.2;
                coins.push({ x: 200 + Math.cos(angle) * dist, y: 200 + Math.sin(angle) * dist, radius: COIN_RAD, mass: MASS, vx: 0, vy: 0, color: (Math.floor(i/2) % 2 === 0) ? '#fdfdfd' : '#2b2b2b', type: (Math.floor(i/2) % 2 === 0) ? 'white' : 'black' });
            }
        }
        setupBoard();

        // --- Multiplayer Sync Events ---
        connection.on("ReceiveShoot", (user, vx, vy) => { 
            lastShooter = user; striker.vx = vx; striker.vy = vy; 
        });
        
        connection.on("ReceiveBoardSync", (user, sX, sY, coinsJson) => {
            if (user !== userEmail) { 
                striker.x = sX; striker.y = sY; striker.vx = 0; striker.vy = 0; 
                coins = JSON.parse(coinsJson);
            }
        });

        // --- Mouse & Touch Controls ---
        function getMousePos(evt) { const rect = canvas.getBoundingClientRect(); return { x: (evt.clientX - rect.left) * (canvas.width / rect.width), y: (evt.clientY - rect.top) * (canvas.height / rect.height) }; }
        function startDrag(pos) { if (Math.hypot(pos.x - striker.x, pos.y - striker.y) <= striker.radius + 15) { isDragging = true; dragStartX = pos.x; dragStartY = pos.y; mouseX = pos.x; mouseY = pos.y; } }
        
        canvas.addEventListener("mousedown", (e) => startDrag(getMousePos(e)));
        canvas.addEventListener("mousemove", (e) => { if (isDragging) { let pos = getMousePos(e); mouseX = pos.x; mouseY = pos.y; } });
        canvas.addEventListener("mouseup", async () => {
            if (isDragging) {
                isDragging = false;
                let vx = (dragStartX - mouseX) * 0.25; let vy = (dragStartY - mouseY) * 0.25;
                if(Math.abs(vx) < 0.5 && Math.abs(vy) < 0.5) return;
                lastShooter = userEmail; striker.vx = vx; striker.vy = vy;
                try { await connection.invoke("ShootStriker", userEmail, vx, vy); } catch (e) {}
            }
        });

        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startDrag({ x: e.touches[0].clientX - canvas.getBoundingClientRect().left, y: e.touches[0].clientY - canvas.getBoundingClientRect().top }); }, { passive: false });
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); if (isDragging) { mouseX = e.touches[0].clientX - canvas.getBoundingClientRect().left; mouseY = e.touches[0].clientY - canvas.getBoundingClientRect().top; } }, { passive: false });
        canvas.addEventListener("touchend", (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mouseup")); }, { passive: false });

        // --- Physics Engine ---
        function resolveCollision(obj1, obj2) {
            let dx = obj2.x - obj1.x; let dy = obj2.y - obj1.y; let dist = Math.hypot(dx, dy);
            if (dist < obj1.radius + obj2.radius) {
                let overlap = 0.5 * (obj1.radius + obj2.radius - dist + 1);
                let nx = dx / dist; let ny = dy / dist;
                obj1.x -= overlap * nx; obj1.y -= overlap * ny;
                obj2.x += overlap * nx; obj2.y += overlap * ny;

                let kx = obj1.vx - obj2.vx; let ky = obj1.vy - obj2.vy;
                let p = 2 * (nx * kx + ny * ky) / (obj1.mass + obj2.mass);
                
                obj1.vx -= p * obj2.mass * nx; obj1.vy -= p * obj2.mass * ny;
                obj2.vx += p * obj1.mass * nx; obj2.vy += p * obj1.mass * ny;

                // Play Collision Sound
                let impact = Math.abs(kx) + Math.abs(ky);
                if(impact > 1) {
                    let s = hitSound.cloneNode();
                    s.volume = Math.min(1, impact / 15);
                    s.play().catch(()=>{});
                }
            }
        }

        // --- 3D Drawing Function ---
        function draw3DCoin(ctx, x, y, radius, type) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 5; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;

            let grad = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/5, x, y, radius);
            if (type === 'white') { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#cccccc'); } 
            else if (type === 'black') { grad.addColorStop(0, '#666666'); grad.addColorStop(1, '#111111'); } 
            else if (type === 'queen') { grad.addColorStop(0, '#ff6b6b'); grad.addColorStop(1, '#b30000'); } 
            else if (type === 'striker') { grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#e0e0e0'); grad.addColorStop(1, '#888888'); }

            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.beginPath(); ctx.arc(x, y, radius - 3, 0, Math.PI * 2);
            ctx.strokeStyle = (type === 'black') ? '#333' : 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.stroke();

            if (type === 'striker') {
                ctx.beginPath(); ctx.arc(x, y, radius - 7, 0, Math.PI * 2); ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = '#ff2a2a'; ctx.fill();
            }
            ctx.restore();
        }

        // --- Main Game Loop ---
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Board Design
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.strokeRect(60, 60, 280, 280); 
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(65, 65, 270, 270);
            
            ctx.beginPath(); ctx.arc(200, 200, 50, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 200, 16, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(230, 57, 70, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
            
            // Pockets
            pockets.forEach(p => { 
                let pGrad = ctx.createRadialGradient(p.x, p.y, p.radius/2, p.x, p.y, p.radius);
                pGrad.addColorStop(0, '#000000'); pGrad.addColorStop(1, '#222222');
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = pGrad; ctx.fill(); 
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.strokeStyle = '#4a2511'; ctx.lineWidth = 3; ctx.stroke();
            });

            // Update Positions & Friction
            let allEntities = [striker, ...coins];
            allEntities.forEach((obj, index) => {
                obj.x += obj.vx; obj.y += obj.vy;
                obj.vx *= 0.985; obj.vy *= 0.985; 
                if(Math.abs(obj.vx) < 0.1) obj.vx = 0; if(Math.abs(obj.vy) < 0.1) obj.vy = 0;

                if (obj.x - obj.radius < 0 || obj.x + obj.radius > canvas.width) { obj.vx *= -0.9; obj.x = Math.max(obj.radius, Math.min(obj.x, canvas.width - obj.radius)); }
                if (obj.y - obj.radius < 0 || obj.y + obj.radius > canvas.height) { obj.vy *= -0.9; obj.y = Math.max(obj.radius, Math.min(obj.y, canvas.height - obj.radius)); }
            });

            // Collisions
            for (let i = 0; i < allEntities.length; i++) {
                for (let j = i + 1; j < allEntities.length; j++) {
                    resolveCollision(allEntities[i], allEntities[j]);
                }
            }

            // Pocket Logic
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                pockets.forEach(p => {
                    if (Math.hypot(coin.x - p.x, coin.y - p.y) < p.radius) {
                        pocketSound.cloneNode().play().catch(()=>{});
                        coins.splice(i, 1); 
                        if (coin.type === 'queen') alert("👑 KADAK! You potted the Queen!");
                    }
                });
            }

            // Sync Logic
            if (lastShooter === userEmail) {
                let isMoving = allEntities.some(obj => Math.abs(obj.vx) > 0 || Math.abs(obj.vy) > 0);
                if (isMoving) { wasMoving = true; } 
                else if (wasMoving && !isMoving) {
                    connection.invoke("SyncBoard", userEmail, striker.x, striker.y, JSON.stringify(coins)).catch(()=>{});
                    wasMoving = false;
                }
            }

            // Aiming Line
            if (isDragging) {
                ctx.beginPath(); ctx.moveTo(striker.x, striker.y); 
                ctx.lineTo(striker.x + (dragStartX - mouseX), striker.y + (dragStartY - mouseY));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }

            // Draw Coins and Striker
            coins.forEach(c => draw3DCoin(ctx, c.x, c.y, c.radius, c.type));
            draw3DCoin(ctx, striker.x, striker.y, striker.radius, 'striker');

            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    </script>
</body>
</html>
